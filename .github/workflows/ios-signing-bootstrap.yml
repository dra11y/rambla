name: iOS Signing Bootstrap

# Creates or renews the App Store distribution certificate and provisioning
# profile in the private match repo. Run it once to set signing up, then again
# whenever the profile expires (Apple gives them one year).

on:
  workflow_dispatch:

concurrency:
  group: ios-signing-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

env:
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  sync-signing:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: packages/app
          bundler-cache: false

      # Commit packages/app/Gemfile.lock after the first green run; bundler
      # cannot cache gems until a lockfile exists.
      - name: Install fastlane
        run: bundle install --jobs 4 --retry 3

      - name: Authorize the match repo over SSH
        env:
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_GIT_PRIVATE_KEY" > ~/.ssh/match_ed25519
          chmod 600 ~/.ssh/match_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/match_ed25519
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Decode the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"
          echo "ASC_KEY_P8=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: Create or renew signing assets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_REPO_URL: ${{ secrets.MATCH_REPO_URL }}
        run: bundle exec fastlane ios sync_signing readonly:false
